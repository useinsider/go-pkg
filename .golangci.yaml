version: "2"

linters:
  default: none
  enable:
    - asasalint
    - bodyclose
    - contextcheck
    - durationcheck
    - errcheck
    - errname
    - errorlint
    - forbidigo
    - forcetypeassert
    - gochecknoinits
    - gomoddirectives
    - gosec
    - govet
    - ineffassign
    - misspell
    - nakedret
    - nestif
    - nilerr
    - nilnil
    - revive
    - staticcheck
    - testableexamples
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - wastedassign
    - whitespace
    - wsl
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
    rules:
      # gomoddirectives rejects local `replace` directives. The
      # test/integration module (the "Integration Tests" check) uses two, on
      # purpose: it must exercise the ins* packages as they are in this
      # checkout, not the last published tag. Scoped to that one go.mod — a
      # local replace in any ins* module is still reported.
      - linters:
          - gomoddirectives
        path: '^test/integration/go\.mod$'
        text: 'local replacement are not allowed'
      # revive's var-naming would have us rename exported identifiers
      # (Id -> ID, Url -> URL, Api -> API). go-pkg is Insider's PUBLIC shared
      # library: every exported symbol is a long-lived contract and a rename
      # is a breaking change needing a /vN bump plus a migration in every
      # consumer — far outside PA-40353. Unexported and local names are still
      # linted; only exported ones are exempt.
      #
      # This lives in exclusions.rules on purpose. Putting a "disabled: true"
      # list under settings.revive.rules REPLACES revive's whole default rule
      # set and silently switches the linter off entirely (PA-40358 found that
      # exact bug live in campaign-api).
      - linters:
          - revive
        text: 'var-naming: (struct field|type|func|method|const|var) [A-Z]'
      # inscodeerr.CodeErr is an exported type consumed across the org; errname
      # wants it renamed to CodeError, which is the same breaking change the
      # rule above avoids. Narrowed to that one identifier.
      - linters:
          - errname
        path: inscodeerr/err\.go$
        text: 'CodeErr'
      # insrequester's tests call Get/Post/... about 60 times without closing
      # the response body. Many of those sites drive error paths where the
      # response is nil by http.Client contract, so a blanket
      # "defer res.Body.Close()" would nil-deref and each site needs its own
      # conditional close. That churn was judged not worth it in a lint PR
      # (PA-40353); the httptest servers are closed by defer and the process
      # exits with the run. Scoped to the two requester modules' test files
      # only — every other module's tests keep bodyclose armed.
      - linters:
          - bodyclose
        path: insrequester/(v3/)?[^/]*_test\.go$
      # insrequester's sendRequest hands the *http.Response back to the caller,
      # who owns Body.Close(); the retryable-status path closes it itself.
      # bodyclose cannot follow the response through the retry closure (v1
      # assigns it to a captured variable) and is fooled by failsafe-go's
      # generic builders typed on *http.Response (v3), so it reports the
      # builder chain and the executor as unclosed bodies. File-scoped because
      # bodyclose reports on the http.Client.Do call and on every generic
      # builder line, which no source matcher can pin down precisely.
      - linters:
          - bodyclose
        path: insrequester/(v3/)?requester\.go$
      # contextcheck cannot see that exec.Context() inside the failsafe-go
      # GetWithExecution closure derives from the ctx handed to WithContext(ctx)
      # on the line above. Only v3 uses failsafe-go; v1 is not exempt.
      # File-scoped because the finding is attributed to the closure as a
      # whole ("sendRequest$2"), not to a matchable source line.
      - linters:
          - contextcheck
        path: insrequester/v3/requester\.go$
      # nilerr: the request-build early return in the retry closure returns nil
      # on purpose — v1's goresilience retry has no abort-on-error, so returning
      # the error would retry an unbuildable request. The error is surfaced via
      # outerErr right after. Narrowed to that exact statement shape; any other
      # error-swallowing return in these files is still reported.
      - linters:
          - nilerr
        path: insrequester/(v3/)?requester\.go$
        source: '^\s*return nil(, nil)?$'
      # nilnil: the same deliberate early return in v3 ("return nil, nil");
      # the *http.Response is discarded and the error travels via outerErr.
      - linters:
          - nilnil
        path: insrequester/v3/requester\.go$
        source: '^\s*return nil, nil$'
