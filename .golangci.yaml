version: "2"

linters:
  default: none
  enable:
    - asasalint
    - bodyclose
    - contextcheck
    - durationcheck
    - errcheck
    - errname
    - errorlint
    - forbidigo
    - forcetypeassert
    - gochecknoinits
    - gomoddirectives
    - gosec
    - govet
    - ineffassign
    - misspell
    - nakedret
    - nestif
    - nilerr
    - nilnil
    - revive
    - staticcheck
    - testableexamples
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - wastedassign
    - whitespace
    - wsl
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
    rules:
      # revive's var-naming would have us rename exported identifiers
      # (Id -> ID, Url -> URL, Api -> API). go-pkg is Insider's PUBLIC shared
      # library: every exported symbol is a long-lived contract and a rename
      # is a breaking change needing a /vN bump plus a migration in every
      # consumer — far outside PA-40353. Unexported and local names are still
      # linted; only exported ones are exempt.
      #
      # This lives in exclusions.rules on purpose. Putting a "disabled: true"
      # list under settings.revive.rules REPLACES revive's whole default rule
      # set and silently switches the linter off entirely (PA-40358 found that
      # exact bug live in campaign-api).
      - linters:
          - revive
        text: 'var-naming: (struct field|type|func|method|const|var) [A-Z]'
      # inscodeerr.CodeErr is an exported type consumed across the org; errname
      # wants it renamed to CodeError, which is the same breaking change the
      # rule above avoids. Narrowed to that one identifier.
      - linters:
          - errname
        path: inscodeerr/err\.go$
        text: 'CodeErr'
      # Test files drive the requester's error paths on purpose, where the
      # returned *http.Response is nil by http.Client contract and there is no
      # body to close. Each test's httptest.Server is closed by defer; the
      # process exits with the test run.
      - linters:
          - bodyclose
        path: _test\.go$
      # insrequester's sendRequest hands the *http.Response back to the caller,
      # who owns Body.Close(); the retryable-status path closes it itself.
      # bodyclose cannot follow the response through the retry closure (v1
      # assigns it to a captured variable) and is fooled by failsafe-go's
      # generic builders typed on *http.Response (v3), so it reports the
      # builder chain and the executor as unclosed bodies. contextcheck cannot
      # see that exec.Context() derives from the ctx passed to WithContext.
      # nilerr/nilnil: the closure deliberately returns nil (v3: nil, nil) for
      # a request-build error so the retry/circuit-breaker policy does not
      # retry an unbuildable request; the error is surfaced through outerErr
      # right after.
      - linters:
          - bodyclose
          - contextcheck
          - nilerr
          - nilnil
        path: insrequester/(v3/)?requester\.go$
