name: Integration Tests

# Mirrors unit-tests.yml: every push, no paths filter. The org ruleset
# (PA-41643/SD-151996) requires a check named exactly "Integration Tests", so
# this must never be skippable.
#
# It cannot be made required on go-pkg YET: the repo is not granted access to
# the runner group, so every self-hosted job here queues and is cancelled
# without reporting (lint.yml:34-43 records the evidence; PA-40353 tracks the
# org-admin grant). CLAUDE.md's check table is authoritative on that status —
# it marks this check BLOCKED. Naming and wiring land now so the check is
# correct the moment the grant does; making it required before then would put
# a permanently unreportable context on every commit.
on: push

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Guarded, not plain `true`: these are REQUIRED checks. Two merges landing
  # on the default branch inside one job window would cancel the earlier
  # commit's run, leaving a required check with a 'cancelled' conclusion
  # and no usable status on that commit. PR branches still supersede.
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/master' }}

jobs:
  integration-tests:
    name: Integration Tests
    # Same runner block as unit-tests.yml / lint.yml. As noted there, go-pkg
    # has no runner-group access yet, which only an org admin can grant.
    runs-on:
      group: default
      labels: self-hosted
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.x

      # Plain `docker run` rather than the `services:` key: that is the shape
      # proven green on this runner pool (useinsider/ucd-web's own
      # integration-tests.yml).
      # Container name AND host port are scoped to this run. Two pushes on
      # different branches are in different concurrency groups, so neither
      # cancels the other; on a shared self-hosted host a fixed name meant the
      # second job's cleanup killed the first job's server mid-test, and a
      # fixed -p 6378:6379 meant the second `docker run` failed with "port is
      # already allocated". Either reds a required check for an unrelated push.
      - name: Start Redis
        run: |
          set -euo pipefail
          docker run -d --name "redis_test_${{ github.run_id }}_${{ github.run_attempt }}" -P redis:7.4-alpine
          port="$(docker port "redis_test_${{ github.run_id }}_${{ github.run_attempt }}" 6379/tcp | head -1 | sed 's/.*://')"
          [ -n "$port" ] || { echo "could not read the mapped Redis port"; exit 1; }
          echo "REDIS_ADDR=localhost:$port" >> "$GITHUB_ENV"
          echo "Redis published on $port"

      - name: Wait for Redis
        run: |
          for i in $(seq 1 30); do
            if docker exec "redis_test_${{ github.run_id }}_${{ github.run_attempt }}" redis-cli ping 2>/dev/null | grep -q PONG; then
              echo "Redis is ready"
              exit 0
            fi
            echo "Waiting for Redis... ($i/30)"
            sleep 2
          done
          echo "Redis did not become ready in 60s"
          exit 1

      # test/integration is its own module (go-pkg has no root module), so it
      # is tested from its own directory.
      - name: Run integration tests
        working-directory: test/integration
        run: go test -count=1 -v ./...

      - name: Stop Redis
        if: always()
        run: docker rm -f "redis_test_${{ github.run_id }}_${{ github.run_attempt }}" || true
