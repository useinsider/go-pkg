name: Lint

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read
  pull-requests: read

jobs:
  discover-modules:
    name: Discover modules
    runs-on:
      labels: self-hosted
    outputs:
      modules: ${{ steps.discover.outputs.modules }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Discover Go modules
        id: discover
        run: echo "modules=$(find . -name go.mod -not -path './.git/*' | xargs -n1 dirname | sort | jq -R -s -c 'split("\n")[:-1]')" >> "$GITHUB_OUTPUT"

  golangci:
    name: golangci-lint
    needs: discover-modules
    runs-on:
      labels: self-hosted
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.discover-modules.outputs.modules) }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.0
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          working-directory: ${{ matrix.module }}
          only-new-issues: true
