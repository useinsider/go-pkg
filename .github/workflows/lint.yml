name: Lint

on:
  # Scoped to the default branches on purpose. An unfiltered push trigger fires
  # a SECOND run for every PR commit, in a different concurrency group from the
  # pull_request run, so neither cancels the other; on a self-hosted pool the
  # duplicate queues and is reclaimed, leaving a red cancelled check on the PR.
  # The dashboard only needs a run on the default-branch head, which this gives.
  push:
    branches:
      - develop
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  # Only supersede in-flight PR runs. A cancelled default-branch run leaves no
  # usable check on the head commit, and the Service Maturity sweep reads that
  # commit to decide the Lint badge — the previous workflow's runs showed up
  # as cancelled/skipped and the badge never went green.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  golangci-lint:
    # One job, not the previous discover-modules + matrix pair: a matrix
    # reports as "golangci-lint (./insdash)" etc, so the branch-protection
    # context list would churn on every module added. The name also carries the
    # "golangci"/"lint" token the Service Maturity tokenizer matches.
    name: golangci-lint
    # GitHub-hosted: go-pkg is public, and public repos get no self-hosted runner.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: "**/go.sum"

      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/v2.12.2/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v2.12.2

      - name: Lint every module
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          status=0
          for mod in $(find . -name go.mod -not -path './.git/*' | xargs -n1 dirname | sort); do
            echo "::group::$mod"
            (cd "$mod" && golangci-lint run --config "$GITHUB_WORKSPACE/.golangci.yaml" ./...) || status=1
            echo "::endgroup::"
          done
          exit $status
